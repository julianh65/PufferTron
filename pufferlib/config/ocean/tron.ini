[base]
package = ocean
env_name = puffer_tron
policy_name = Policy
rnn_name = Recurrent

[vec]
num_envs = 16
num_workers = 16
backend = Multiprocessing
batch_size = auto

[env]
map_width = 64
map_height = 64
vision_size = 15
num_agents = 8
spawn_separation = 5
spawn_margin = 2
spawn_attempts = 0
max_round_steps = 8192
reward_alive = 0.0005
reward_step = 0.0
reward_win = 0.5
reward_loss = -1.0
reward_tie = -0.3
reward_timeout = 0
reward_kill = 0.5
log_interval = 512
render_scale = 6
video_env_index = 0

[train]
total_timesteps = 100_000_000
gamma = 0.99
learning_rate = 0.015
video_interval = 200_000
video_length = 800
video_fps = 12
batch_size = 65536
minibatch_size = 16384
bptt_horizon = 64
heuristic_eval_interval = 200_000
heuristic_eval_episodes = 8
heuristic_eval_num_agents = 4
