[base]
package = ocean
env_name = puffer_tron
policy_name = TronProcgenResnet
rnn_name = TronRecurrent

[policy]
cnn_width = 32
mlp_width = 512

[rnn]
input_size = 512
hidden_size = 512

[vec]
num_envs = 2048
num_workers = 16
backend = Multiprocessing
batch_size = auto

[env]
map_width = 32
map_height = 32
vision_size = 36
num_agents = 2
spawn_separation = 3
spawn_margin = 2
spawn_attempts = 0
max_round_steps = 8192
reward_alive = 0.00004
reward_step = 0.0
reward_win = 1.0
reward_loss = -0.75
reward_tie = 0.15
reward_timeout = 0
reward_kill = 0.12
log_interval = 512
render_scale = 6
video_env_index = 0

[train]
total_timesteps = 14_000_000_000
gamma =  0.993
learning_rate = 0.0012
video_interval = 200_000_000
video_length = 900
video_fps = 12
batch_size = 262144 
minibatch_size = 16384
bptt_horizon = 64
heuristic_eval_interval = 200_000_000
heuristic_eval_episodes = 5
heuristic_eval_num_agents = 2
heuristic_eval_video_opponent = classic
heuristic_eval_video_length = 9000
heuristic_eval_video_fps = 16
heuristic_eval_tronbot_timeout = 15
heuristic_eval_map_width = 32
heuristic_eval_map_height = 32
heuristic_eval_max_round_steps = 32768
heuristic_eval_tronbot_debug = False
heuristic_eval_combo_win_weight = 0.2
heuristic_eval_combo_length_weight = 0.8
heuristic_eval_combo_length_base = 8000
optimizer = adam
gae_lambda = 0.9745069
ent_coef = 0.022
prio_alpha = 0.4


[sweep]
method = Protein
metric = heuristic_classic_combo_score
goal = maximize
downsample = 6

[sweep.train.total_timesteps]
distribution = log_normal
min = 1.2e8
max = 3e8
mean = 1.7e8
scale = time

[sweep.train.bptt_horizon]
distribution = uniform_pow2
min = 32
max = 128
mean = 64
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 16384
max = 65536
mean = 32768
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.003
max = 0.02
mean = 0.009
scale = 0.35

[sweep.train.ent_coef]
distribution = log_normal
min = 5e-4
max = 8e-3
mean = 2.5e-3
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.985
max = 0.998
mean = 0.993
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.92
max = 0.985
mean = 0.955
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.12
max = 0.24
mean = 0.18
scale = auto

[sweep.train.vf_coef]
distribution = uniform
min = 1.0
max = 2.2
mean = 1.6
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.5
max = 2.0
mean = 1.1
scale = auto

[sweep.train.adam_beta1]
distribution = logit_normal
min = 0.85
max = 0.98
mean = 0.92
scale = auto

[sweep.train.adam_beta2]
distribution = logit_normal
min = 0.98
max = 0.9995
mean = 0.9985
scale = auto

[sweep.train.adam_eps]
distribution = log_normal
min = 1e-12
max = 1e-6
mean = 1e-8
scale = auto

[sweep.train.vtrace_rho_clip]
distribution = uniform
min = 0.5
max = 2.5
mean = 1.0
scale = auto

[sweep.train.vtrace_c_clip]
distribution = uniform
min = 0.5
max = 2.5
mean = 1.0
scale = auto

[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.15
max = 0.6
mean = 0.3
scale = auto

[sweep.train.prio_alpha]
distribution = logit_normal
min = 0.75
max = 0.95
mean = 0.85
scale = auto

[sweep.train.prio_beta0]
distribution = logit_normal
min = 0.75
max = 0.95
mean = 0.85
scale = auto

[sweep.env.reward_alive]
distribution = log_normal
min = 8e-4
max = 0.003
mean = 0.0016
scale = auto

[sweep.env.vision_size]
distribution = int_uniform
min = 28
max = 40
mean = 32
scale = 4
